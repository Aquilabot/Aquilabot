<g clip-path="url(#win)"><g class="scroll"><g><text x="24" y="81" fill="#7e8781">$</text><text x="39.6" y="81" fill="#e6e9e5" textLength="522.6" lengthAdjust="spacingAndGlyphs">node --import tsx tools/src/bg3-test.ts --scenario crooked.dead-aim</text><rect class="cover" x="39.6" y="68" width="538.2" height="20" fill="#0e100f"/><rect class="cursor" x="39.6" y="69" width="7.8" height="16" fill="#8fe3ad"/></g><g class="r1"><text x="24" y="101" fill="#8fe3ad">PASS</text><text x="63" y="101" fill="#e6e9e5">mods-loaded</text><text x="312.59999999999997" y="101" fill="#7e8781">Required BG3 mods are loaded in order</text></g><g class="r2"><text x="24" y="121" fill="#8fe3ad">PASS</text><text x="63" y="121" fill="#e6e9e5">dead-aim-range</text><text x="312.59999999999997" y="121" fill="#7e8781">Dead Aim is loaded with an 18 metre target radius</text></g><g class="r3"><text x="24" y="141" fill="#8fe3ad">PASS</text><text x="63" y="141" fill="#e6e9e5">dead-aim-cost-definition</text><text x="312.59999999999997" y="141" fill="#7e8781">Dead Aim is loaded with a one bonus action cost</text></g><g class="r4"><text x="24" y="161" fill="#8fe3ad">PASS</text><text x="63" y="161" fill="#e6e9e5">dead-aim-start-turn-tick</text><text x="312.59999999999997" y="161" fill="#7e8781">Dead Aim readiness is configured to tick at start of turn</text></g><g class="r5"><text x="24" y="181" fill="#8fe3ad">PASS</text><text x="63" y="181" fill="#e6e9e5">fixture-gameplay-ready</text><text x="312.59999999999997" y="181" fill="#7e8781">The disposable save reached controllable gameplay before fixture set…</text></g><g class="r6"><text x="24" y="201" fill="#8fe3ad">PASS</text><text x="63" y="201" fill="#e6e9e5">fixture-feature-origin</text><text x="312.59999999999997" y="201" fill="#7e8781">Actor features were prepared for mechanics; this does not validate a…</text></g><g class="r7"><text x="24" y="221" fill="#8fe3ad">PASS</text><text x="63" y="221" fill="#e6e9e5">fixture-features-ready</text><text x="312.59999999999997" y="221" fill="#7e8781">The prepared actor has the required passives and spells</text></g><g class="r8"><text x="24" y="241" fill="#8fe3ad">PASS</text><text x="63" y="241" fill="#e6e9e5">fixture-line-of-sight</text><text x="312.59999999999997" y="241" fill="#7e8781">The temporary target has line of sight to the prepared hunter</text></g><g class="r9"><text x="24" y="261" fill="#8fe3ad">PASS</text><text x="63" y="261" fill="#e6e9e5">fixture-within-range</text><text x="312.59999999999997" y="261" fill="#7e8781">The disposable target was placed within Dead Aim's 18 metre range</text></g><g class="r10"><text x="24" y="281" fill="#8fe3ad">PASS</text><text x="63" y="281" fill="#e6e9e5">force-turn-based-entered</text><text x="312.59999999999997" y="281" fill="#7e8781">The hunter entered Force Turn Based before fixture actions began</text></g><g class="r11"><text x="24" y="301" fill="#8fe3ad">PASS</text><text x="63" y="301" fill="#e6e9e5">bonus-action-available</text><text x="312.59999999999997" y="301" fill="#7e8781">The fixture began with a usable bonus action</text></g><g class="r12"><text x="24" y="321" fill="#8fe3ad">PASS</text><text x="63" y="321" fill="#e6e9e5">baseline-resistance</text><text x="312.59999999999997" y="321" fill="#7e8781">The resistant target halved the unmarked 8 Fire attack</text></g><g class="r13"><text x="24" y="341" fill="#8fe3ad">PASS</text><text x="63" y="341" fill="#e6e9e5">foreign-mark-prepared</text><text x="312.59999999999997" y="341" fill="#7e8781">The target is marked by another ready hunter while the attacking hun…</text></g><g class="r14"><text x="24" y="361" fill="#8fe3ad">PASS</text><text x="63" y="361" fill="#e6e9e5">foreign-mark-resistant</text><text x="312.59999999999997" y="361" fill="#7e8781">Another hunter's mark does not bypass resistance for the ready attac…</text></g><g class="r15"><text x="24" y="381" fill="#8fe3ad">PASS</text><text x="63" y="381" fill="#e6e9e5">foreign-mark-not-consumed</text><text x="312.59999999999997" y="381" fill="#7e8781">Foreign damage preserves both hunters' readiness and the owned mark</text></g><g class="r16"><text x="24" y="401" fill="#8fe3ad">PASS</text><text x="63" y="401" fill="#e6e9e5">bonus-action-cost</text><text x="312.59999999999997" y="401" fill="#7e8781">Casting Dead Aim spent exactly one bonus action</text></g><g class="r17"><text x="24" y="421" fill="#8fe3ad">PASS</text><text x="63" y="421" fill="#e6e9e5">mark-owner</text><text x="312.59999999999997" y="421" fill="#7e8781">The Dead Aim mark belongs to the hunter that cast it</text></g><g class="r18"><text x="24" y="441" fill="#8fe3ad">PASS</text><text x="63" y="441" fill="#e6e9e5">start-turn-expiry</text><text x="312.59999999999997" y="441" fill="#7e8781">An unused Dead Aim expired at the start of the hunter's next turn</text></g><g class="r19"><text x="24" y="461" fill="#8fe3ad">PASS</text><text x="63" y="461" fill="#e6e9e5">expired-hit-resistant</text><text x="312.59999999999997" y="461" fill="#7e8781">The attack remained resisted after the unused mark expired</text></g><g class="r20"><text x="24" y="481" fill="#8fe3ad">PASS</text><text x="63" y="481" fill="#e6e9e5">second-mark-owner</text><text x="312.59999999999997" y="481" fill="#7e8781">The second Dead Aim mark retained the same hunter owner</text></g><g class="r21"><text x="24" y="501" fill="#8fe3ad">PASS</text><text x="63" y="501" fill="#e6e9e5">marked-hit-bypasses-resistance</text><text x="312.59999999999997" y="501" fill="#7e8781">The marked attack ignored the target's Fire resistance</text></g><g class="r22"><text x="24" y="521" fill="#8fe3ad">PASS</text><text x="63" y="521" fill="#e6e9e5">positive-damage-consumes</text><text x="312.59999999999997" y="521" fill="#7e8781">Positive marked damage consumed Dead Aim and removed its owned mark</text></g><g class="r23"><text x="24" y="541" fill="#8fe3ad">PASS</text><text x="63" y="541" fill="#e6e9e5">post-consume-resistant</text><text x="312.59999999999997" y="541" fill="#7e8781">Resistance applied again after Dead Aim was consumed</text></g><g class="r24"><text x="24" y="561" fill="#a3aba5">TIME</text><text x="63" y="561" fill="#a3aba5">crooked.dead-aim: 26000 ms</text></g><g class="r25"><rect x="20" y="566" width="39.2" height="20" rx="3" fill="#8fe3ad"/><text x="24" y="581" fill="#0e100f" font-weight="700">PASS</text><text x="63" y="581" fill="#e6e9e5" font-weight="700">crooked.dead-aim</text></g></g></g>
